[package]
name = "fluxdi"
keywords = ["dependency-injection", "di", "fluxdi", "semi-automatic", "axum-di"]
description = "FluxDI - Semi-Automatic Dependency Injector"
readme = "README.md"

version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
license-file.workspace = true
authors.workspace = true

[dependencies]
tracing = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
actix-web = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = ["env-filter", "fmt"] }
dashmap = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread"], optional = true }
fluxdi-macros = { path = "../fluxdi-macros", optional = true, version = "1.2.2" }
futures.workspace = true

[features]
default = ["debug"]

thread-safe = []
lock-free = ["thread-safe", "dep:dashmap"]
tracing = ["dep:tracing"]
logging = ["tracing", "dep:tracing-subscriber"]
axum = ["thread-safe", "dep:axum"]
actix = ["thread-safe", "dep:actix-web"]
async-factory = []
resource-limit-async = ["thread-safe", "async-factory", "dep:tokio"]
metrics = []
prometheus = ["metrics"]
opentelemetry = [
    "tracing",
    "dep:opentelemetry",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]
debug = []
macros = ["dep:fluxdi-macros"]
lifecycle = ["dep:tokio"]

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
tower = { workspace = true, features = ["util"] }

[[bench]]
name = "injector_baseline"
harness = false

[[example]]
name = "static_module"
required-features = ["macros"]

[[example]]
name = "static_composition_async"
required-features = ["macros", "async-factory"]
