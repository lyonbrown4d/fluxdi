[workspace]
members = ["fluxdi", "fluxdi-macros", "examples/*"]
exclude = ["examples/seaorm-sqlite"]
default-members = ["fluxdi"]
resolver = "2"

[workspace.metadata.spellcheck]
config = "spellcheck.toml"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.99.1"
repository = "https://github.com/lyonbrown4d/fluxdi"
homepage = "https://github.com/lyonbrown4d/fluxdi"
license-file = "LICENSE"
authors = ["João Pedro Martins <mjoaopedro61@gmail.com>"]

[workspace.dependencies]
actix-web = "4.17.0"
async-trait = "0.1.92"
axum = "0.8.9"
criterion = "0.8.2"
dashmap = "6.2.1"
futures = "0.3.34"
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = "0.10.3"
rusqlite = "0.40.2"
sea-orm = "2.0.4"
serde = "1.0.229"
serde_json = "1.0.154"
syn = "3.0.9"
tokio = "1.53.3"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = "0.3.23"
